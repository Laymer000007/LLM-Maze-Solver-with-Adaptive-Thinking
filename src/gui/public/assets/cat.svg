<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- An original, generic sitting cat in side view: flat colours and a dark outline, like the mouse and cheese. -->
  <g stroke="#0b1638" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail curling round the front -->
    <path d="M30 86 C12 86 8 66 18 56" fill="none" stroke-width="13"/>
    <path d="M30 86 C12 86 8 66 18 56" fill="none" stroke="#f0a24b" stroke-width="6"/>
    <!-- body -->
    <path d="M28 90 C20 72 26 50 44 45 C58 42 70 54 72 70 C73 82 70 90 62 90 Z" fill="#f0a24b"/>
    <!-- chest -->
    <path d="M56 50 C64 56 66 68 62 80 C56 74 54 62 56 50 Z" fill="#fbe3c2" stroke="none"/>
    <!-- front leg and paw -->
    <path d="M55 64 L56 88 C56 91 66 91 67 88 L66 66" fill="#f0a24b"/>
    <!-- ears -->
    <path d="M50 26 L49 8 L62 19 Z" fill="#f0a24b"/>
    <path d="M67 18 L77 5 L79 24 Z" fill="#f0a24b"/>
    <!-- head -->
    <path d="M47 33 C47 21 58 16 68 18 C78 20 84 28 82 38 C80 47 70 51 60 49 C52 47 47 41 47 33 Z" fill="#f0a24b"/>
  </g>
  <!-- inner ears, muzzle, eye and nose -->
  <path d="M53 22 L53 14 L58 19 Z" fill="#f3a7a0"/>
  <path d="M71 18 L76 11 L77 21 Z" fill="#f3a7a0"/>
  <path d="M70 41 C74 46 81 45 82 39 C79 37 73 37 70 41 Z" fill="#fbe3c2"/>
  <ellipse cx="70" cy="31" rx="3.2" ry="4.2" fill="#0b1638"/>
  <circle cx="71" cy="29.6" r="1.1" fill="#fff"/>
  <path d="M80 35.5 L84 34.5 L82.5 38 Z" fill="#e0707a" stroke="#0b1638" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M78 41 L92 39 M78 43 L91 45" stroke="#0b1638" stroke-width="1.4" stroke-linecap="round"/>
</svg>
