<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Settings</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="settings-page">
  <header><div><p class="eyebrow">LLM MAZE SOLVER</p><h1>AI Settings</h1><p class="subtitle">The Ollama model that drives the mouse.</p></div></header>
  <section class="card settings-card">
    <div class="section-title">OLLAMA</div>
    <label>Ollama Server URL<input id="baseUrl" type="url" placeholder="http://localhost:11434"></label>
    <label>Model<select id="model"></select></label>
    <label>Temperature<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2"></label>
    <p class="hint">Every request uses think off and a JSON schema that only accepts the offered directions. Settings cannot change while a request is in flight: stop or reset first.</p>
    <div class="actions"><button id="test">Test Connection</button><button id="save">Save Settings</button><a class="button secondary" href="/">Back to Maze</a></div>
    <p id="status" role="status"></p>
  </section>
</main>
<script src="/settings.js"></script>
</body>
</html>
