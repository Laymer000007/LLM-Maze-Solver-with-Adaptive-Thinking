<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Settings</title><link rel="stylesheet" href="/style.css"></head><body><main class="settings-page"><header><div><p class="eyebrow">LLM MAZE SOLVER WITH ADAPTIVE THINKING v3.0.0</p><h1>LLM Settings</h1><p class="subtitle">Configure the Ollama server and model used by the maze mouse.</p></div></header><section class="card settings-card"><label>Ollama Server URL<input id="baseUrl" type="url" placeholder="http://localhost:11434" value="http://localhost:11434"></label><label>Model<input id="model" placeholder="qwen3:1.7b" value="qwen3:1.7b"></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2"></label><p class="hint">Ollama is used locally and supports the adaptive thinking control required by Version 3.0.</p><div class="actions"><button id="test">Test Connection</button><button id="save">Save Settings</button><a class="button secondary" href="/">Back to Maze</a></div><p id="status" role="status"></p></section></main><script src="/settings.js"></script></body></html>
